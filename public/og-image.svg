<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgRadial1" cx="20%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bgRadial2" cx="80%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.16" />
      <stop offset="55%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
    <linearGradient id="gauge" x1="280" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#bgRadial1)" />
  <rect width="1200" height="630" fill="url(#bgRadial2)" />

  <!-- Card frame -->
  <rect x="70" y="70" width="1060" height="490" rx="36" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />

  <!-- Clean speedometer gauge -->
  <path
    d="M 300 420 A 300 300 0 0 1 900 420"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.12"
    stroke-width="44"
    stroke-linecap="round"
  />
  <path
    d="M 300 420 A 300 300 0 0 1 900 420"
    fill="none"
    stroke="url(#gauge)"
    stroke-width="44"
    stroke-linecap="round"
    filter="url(#soft)"
  />

  <!-- Marker (centered at the arc midpoint) -->
  <circle cx="600" cy="120" r="30" fill="#ffffff" stroke="#0b1020" stroke-opacity="0.65" stroke-width="6" />
  <circle cx="600" cy="120" r="14" fill="#0b1020" fill-opacity="0.95" />

  <!-- Text -->
  <text x="600" y="470" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#ffffff" fill-opacity="0.92">
    Bitcoin Analytics
  </text>
  <text x="600" y="522" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#ffffff" fill-opacity="0.65">
    Market stats + multichain wallet balances
  </text>
</svg>
