<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('theme')
          const theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.dataset.theme = theme
        } catch {
          // ignore
        }
      })()
    </script>
    <meta
      name="description"
      content="Bitcoin Analytics dashboard: market stats, BTC price charts, and multichain wallet balances."
    />

    <!-- Open Graph / Twitter (link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitcoin Analytics" />
    <meta property="og:title" content="Bitcoin Analytics" />
    <meta
      property="og:description"
      content="Bitcoin Analytics dashboard: market stats, BTC price charts, and multichain wallet balances."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bitcoin Analytics" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitcoin Analytics" />
    <meta
      name="twitter:description"
      content="Bitcoin Analytics dashboard: market stats, BTC price charts, and multichain wallet balances."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="Bitcoin Analytics" />

    <meta name="theme-color" content="#0b1020" />
    <title>Bitcoin Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
